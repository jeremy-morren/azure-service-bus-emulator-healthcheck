name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch
  push:
    branches: [ main, actions ]
  # Trigger the workflow on any pull request
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Run the tests on the latest Ubuntu runner
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      # Required permissions for EnricoMi/publish-unit-test-result-action@v2
      checks: write
      pull-requests: write
    env:
      project: 'src/ServiceBusEmulator.Healthcheck.Tests/ServiceBusEmulator.Healthcheck.Tests.csproj'
      dockerTest: src/Test
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet publish ${{ env.project }} -c Release -r linux-x64 -o src/publish "/p:AotMsCodeCoverageInstrumentation=true"

      - name: Start ServiceBus Emulator
        working-directory: src/Test
        run: >-
          docker compose up -d --wait &&
          curl 'http://localhost:5300/health' -i --retry 10 --retry-all-errors --retry-max-time 60 --retry-delay 5

      - name: Test
        id: test
        run: src/publish/ServiceBusEmulator.Healthcheck.Tests --coverage --report-trx --results-directory ${{ runner.temp }}/TestResults

      - name: Upload dotnet test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults
        if: ${{ always() }}
        
      # Publish test results to job summary
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ always() }}
        with:
          files: ${{ runner.temp }}/TestResults/**/*.trx

  build:
    strategy:
      matrix:
        runner: [ ubuntu-latest , ubuntu-24.04-arm ]

    name: Build on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    env:
      project: 'src/ServiceBusEmulator.Healthcheck/ServiceBusEmulator.Healthcheck.csproj'
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore
        run: dotnet restore ${{ env.project }}

      - name: Publish
        run: dotnet publish ${{ env.project }} -o ${{ runner.temp }}/publish
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.runner }}
          path: ${{ runner.temp }}/publish
  
  # Prepare a draft release for GitHub Releases page for the manual verification
  releaseDraft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build, test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      artifacts: $GITHUB_WORKSPACE/artifacts
      tarOut: $GITHUB_WORKSPACE/artifacts/ServiceBusEmulator.Healthcheck-$VERSION

      # Compress to .tar.gz (gzip -9 maximum compression)
      tarArgs: --create --use-compress-program='gzip -9'
      # Tar args (1 that excludes debug symbols and adds everything else, and 1 that includes only debug symbols)
      tarExcludeDbg: --exclude='*.dbg' .
      includeDbg: '*.dbg'
    steps:
      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Get the version number from src/version.txt
      - name: Get Version
        run: >-
          version="v$(cat src/version.txt)" && 
          echo "Version: ${version}" && 
          echo "VERSION=${version}" >> $GITHUB_ENV

      # Compress the artifacts from the build jobs into .tar.gz files for each architecture
      - name: Download build artifacts
        uses: actions/download-artifact@v8

      # Create 2 tar.gz files for each architecture: one with debug symbols and one without
      - run: >-
          mkdir ${{ env.artifacts }} &&
          cd ${{ github.workspace }}/build-ubuntu-latest &&
          tar ${{ env.tarArgs }} -f ${{ env.tarOut }}-amd64.tar.gz ${{ env.tarExcludeDbg }} &&
          tar ${{ env.tarArgs }} -f ${{ env.tarOut }}-amd64-debug.tar.gz ${{ env.includeDbg }} &&
          cd ${{ github.workspace }}/build-ubuntu-24.04-arm &&
          tar ${{ env.tarArgs }} -f ${{ env.tarOut }}-arm64.tar.gz ${{ env.tarExcludeDbg }} &&
          tar ${{ env.tarArgs }} -f ${{ env.tarOut }}-arm64-debug.tar.gz ${{ env.includeDbg }} &&
          ls -l ${{ env.artifacts }}
        name: Create gzip artifacts

      # Check if tag exists, if it does, skip the rest of the steps
      - name: Check if tag exists
        id: check_tag
        run: >-
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists: $VERSION"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag does not exist: $VERSION"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Remove old release drafts by using the curl request for the available releases with a draft flag
      - name: Remove Old Release Drafts
        if: steps.check_tag.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api repos/{owner}/{repo}/releases 
          --jq '.[] | select(.draft == true) | .id'
          | xargs -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      # Create a new release draft which is not publicly visible and requires manual acceptance
      - name: Create Release Draft
        if: steps.check_tag.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$VERSION" 
          --draft --title "$VERSION" --generate-notes 
          --target ${{ github.sha }} &&
          gh release upload "$VERSION" artifacts/*

